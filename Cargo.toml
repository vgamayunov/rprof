[workspace]
members = ["crates/rprof-core", "crates/rprof-capture", "crates/rprof-report", "crates/rprof-io-protocol", "crates/rprof-preload", "crates/rprof-mpi-protocol", "crates/rprof-mpi", "crates/rprof-ompt-protocol", "crates/rprof-ompt", "crates/rprof-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rprof-core = { path = "crates/rprof-core" }
rprof-capture = { path = "crates/rprof-capture" }
rprof-report = { path = "crates/rprof-report" }
rprof-io-protocol = { path = "crates/rprof-io-protocol" }
rprof-mpi-protocol = { path = "crates/rprof-mpi-protocol" }
rprof-ompt-protocol = { path = "crates/rprof-ompt-protocol" }
libc = "0.2"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
tiny_http = "0.12"
