[workspace]
members = ["crates/rprof-core", "crates/rprof-capture", "crates/rprof-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rprof-core = { path = "crates/rprof-core" }
rprof-capture = { path = "crates/rprof-capture" }
libc = "0.2"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
