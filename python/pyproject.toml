[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rprof-python"
version = "0.1.0"
description = "Optional CPython and framework-owned PyTorch integration for rprof"
requires-python = ">=3.10"

[project.optional-dependencies]
torch = ["torch>=2.2"]

[tool.setuptools]
packages = ["rprof_python"]
